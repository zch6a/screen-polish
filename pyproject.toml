[project]
name = "screen-polish"
version = "0.1.0"
description = "Make a screen recording you already have look produced: zoom where things happen, found from the pixels, and frame it on a background. A command, no special recorder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "imageio-ffmpeg>=0.5"]
keywords = ["screen-recording", "screencast", "auto-zoom", "video", "ffmpeg", "demo", "screen-studio"]

[project.urls]
Homepage = "https://github.com/zch6a/screen-polish"
Issues = "https://github.com/zch6a/screen-polish/issues"

[project.scripts]
screen-polish = "screen_polish.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_polish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM108"]
